name: CashierApp
options:
  bundleIdPrefix: com.pavilionpay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID (also needed in web/.well-known/apple-app-site-association)
targets:
  CashierApp:
    type: application
    platform: iOS
    sources:
      - CashierApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pavilionpay.cashierdemo
        CODE_SIGN_ENTITLEMENTS: CashierApp/CashierApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cashier Demo
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    info:
      path: CashierApp/Info.plist
      properties:
        # Lets URLSession reach the local test server (server/server.py) over http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Custom scheme used only as the ASWebAuthenticationSession callback on iOS < 17.4
        CFBundleURLTypes:
          - CFBundleURLName: com.pavilionpay.cashierdemo
            CFBundleURLSchemes: [cashierdemo]
